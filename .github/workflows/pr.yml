name: pr

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv sync --extra dev
      - run: uv run pyright

  test-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra docs
      - run: uv run pytest -m "not slow and not perf and not gpu" --cov --doctest-modules src/seq_sklearn/

  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Sync with dev + onnx extras
        run: uv sync --extra dev --extra onnx
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel in a clean venv
        run: |
          uv venv .venv-deploy --python 3.14
          source .venv-deploy/bin/activate
          uv pip install dist/*.whl
          python -c "import seq_sklearn; print(seq_sklearn.__version__)"
      # Phase 10: the deploy/onnx gate is live. The wheel test consumes
      # the wheel just built (SEQ_SKLEARN_WHEEL) instead of rebuilding.
      - name: Deploy + ONNX gate
        run: |
          export SEQ_SKLEARN_WHEEL="$(ls dist/*.whl | head -1)"
          uv run pytest tests/deploy/ tests/integration/test_onnx_parity.py -m "deploy or onnx"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - name: Sync with dev + docs extras
        run: uv sync --extra dev --extra docs
      - name: Build site (warnings-as-errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Doctest pass
        run: uv run sphinx-build -W -b doctest docs docs/_build/doctest
      - name: tests/docs/ gate roster
        run: uv run pytest tests/docs/ -q -p no:cacheprovider

  snapshot-guard:
    runs-on: ubuntu-latest
    env:
      PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: bash scripts/check_snapshots.sh

  perf-baseline-guard:
    runs-on: ubuntu-latest
    env:
      PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: bash scripts/check_perf_baselines.sh
