name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.5.11"

jobs:
  full-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra onnx
      - run: uv run pytest -m "not gpu and not perf" --cov

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv sync --extra dev
      - run: uv run pytest -m perf --benchmark-only || echo "tests/perf/ empty in Phase 0"

  gpu:
    runs-on: [self-hosted, gpu]
    if: ${{ vars.GPU_RUNNER_AVAILABLE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
      - run: uv sync --extra dev
      - run: uv run pytest -m "gpu and not slow"
