# HPO uplift smoke: does Optuna close the gap to GBMs for TFT?
#
# Runs raw_loss (defaults) + hpo_uplift (best of 25 Optuna trials per
# (dataset, model, seed)) on synthetic_binary_small. The uplift driver
# reports per-dataset delta_loss = loss(default) - loss(HPO-best); a
# positive value means HPO improved the model.
#
# Hypothesis: TFT's defaults leave 10-30% on the table; GBM defaults
# are battle-tested and barely move. The lift table should show TFT's
# delta_loss much larger than the three GBMs', which would mean the
# "TFT is weaker" story is partly an HPO story.
#
# Wall budget: ~2.5 hours on the single Blackwell GPU.

datasets = ["synthetic_binary_small"]
models = [
    "tft_classifier",
    "lightgbm_classifier",
    "xgboost_classifier",
    "catboost_classifier",
]
output_dir = ".cache/benchmarks/runs/hpo-uplift-synth-binary"
cache_dir = ".cache/benchmarks"

[[experiments]]
kind = "raw_loss"
seeds = [0]
bootstrap_n_resamples = 1000

[[experiments]]
kind = "hpo_uplift"
seeds = [0]
n_trials = 25
bootstrap_n_resamples = 1000
