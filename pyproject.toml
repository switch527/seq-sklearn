[project]
name = "seq-sklearn"
version = "0.0.0"
description = "sklearn-compatible deep sequence models for tabular panel data"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steve" }]
keywords = [
    "scikit-learn",
    "pytorch",
    "deep-learning",
    "time-series",
    "tabular",
    "tft",
    "temporal-fusion-transformer",
    "classification",
    "regression",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6,<3",
    "lightning>=2.6.1,<2.7",
    "pydantic>=2.12,<3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.6,<2",
    "optuna>=4.4,<5",
    "optuna-integration>=4.4,<5",
    "safetensors>=0.5",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.18",
    "onnxruntime>=1.21",
    "onnxscript>=0.6",
]
mlflow = ["mlflow>=2.18"]
wandb = ["wandb>=0.19"]
docs = [
    "sphinx>=8.1,<9",
    "pydata-sphinx-theme>=0.16,<0.17",
    "numpydoc>=1.8,<2",
    "myst-parser>=4.0,<5",
    "sphinx-copybutton>=0.5,<0.6",
    "sphinx-sitemap>=2.6,<3",
    "sphinx-gallery>=0.18,<0.19",
    "autodoc-pydantic>=2.2,<3",
    "matplotlib>=3.9,<4",
]
# Comparative benchmark-suite dependencies (`docs/benchmark_suite_design.md`).
# NOT shipped in the wheel; the harness is opt-in via this extra. Heavy
# transitive deps (lightgbm/xgboost/catboost) are pulled in here because
# the Phase B5+ experiments need them; Phase B0 itself only needs the
# stdlib, pydantic, and pyarrow for the cache layer. The classical-TSC
# baseline (`aeon`) is intentionally NOT in any extra: aeon 0.11.x
# pins scikit-learn < 1.6 which conflicts with the library's own
# scikit-learn >= 1.6 requirement, and no compatible version exists
# at v1.0.0 cut. Phase B2's TSC adapter (`benchmarks/adapters/tsc.py`)
# documents the manual-install path; a future release that loosens
# aeon's sklearn pin promotes it into a `benchmarks-tsc` sibling extra.
benchmarks = [
    "openml>=0.15,<0.16",
    "pyarrow>=21",
    "lightgbm>=4.5,<5",
    "xgboost>=2.1,<3",
    "catboost>=1.2,<2",
]
dev = [
    "ruff>=0.7",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "pytest-rerunfailures>=15.0",
    "pytest-benchmark>=5.0",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/switch527/seq-sklearn"
Repository = "https://github.com/switch527/seq-sklearn"
Issues = "https://github.com/switch527/seq-sklearn/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seq_sklearn"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "N",      # pep8-naming
    "ANN",    # flake8-annotations
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
]
ignore = [
    "ANN401",  # allow Any in some payload signatures
    "E501",    # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]
"docs/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["seq_sklearn"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: runtime > 2s; excluded from per-PR CI",
    "gpu: requires CUDA; skipped on CPU runners",
    "integration: paired-component tests",
    "e2e: end-to-end tests against synthetic data",
    "deploy: wheel-install smoke tests",
    "onnx: requires the [onnx] extra and onnxruntime",
    "perf: performance regression benchmarks; nightly only",
    "flaky: known non-deterministic; retried once via pytest-rerunfailures",
    "determinism: verifies bit-identical output across runs",
]

[tool.coverage.run]
source = ["src/seq_sklearn"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "def __repr__",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true

